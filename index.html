<!-- React + Babel (JSX with no build step) -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<style>
  html,body{margin:0;padding:0;background:#ECEFF3;}
  #root{min-height:100vh;}

  .pp-root{
    --paper:#ECEFF3; --card:#FFFFFF; --ink:#10151C; --muted:#5B6672;
    --line:#DCE2EA; --cobalt:#2743E0; --cobalt-deep:#1B2FA6; --pop:#D6FB4A;
    --warn:#E23D3D; --shadow:0 1px 2px rgba(16,21,28,.06),0 6px 20px rgba(16,21,28,.05);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink); background:var(--paper); min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .pp-mono{font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}
  .pp-wrap{max-width:600px;margin:0 auto;padding:0 16px 64px;}
  .pp-checker{height:8px;background:conic-gradient(var(--ink) 90deg,transparent 90deg 180deg,var(--ink) 180deg 270deg,transparent 270deg) 0 0/12px 12px;}
  .pp-head{padding:22px 0 10px;}
  .pp-title{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1;margin:0;}
  .pp-title span{color:var(--cobalt);}
  .pp-sub{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.5;}
  .pp-privacy{margin:10px 0 0;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;}
  .pp-dot{width:7px;height:7px;border-radius:50%;background:var(--cobalt);display:inline-block;flex:none;}
  .pp-dot.live{background:#1DB954;}
  .pp-deadline{margin:6px 0 0;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;}
  .pp-deadline b{color:var(--ink);font-weight:600;}
  .pp-deadline.closed b{color:var(--warn);}

  .pp-tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:16px 0 20px;box-shadow:var(--shadow);}
  .pp-tab{flex:1;border:0;background:transparent;padding:10px 6px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;}
  .pp-tab.on{background:var(--ink);color:#fff;}

  .pp-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);}
  .pp-namebar{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0 12px;}
  .pp-label{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px;}
  .pp-input{width:100%;box-sizing:border-box;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);outline:none;}
  .pp-input:focus{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(39,67,224,.14);}
  .pp-input:disabled{background:#F1F3F6;color:var(--muted);}
  .pp-hint{font-size:12px;color:var(--muted);margin:6px 2px 0;line-height:1.5;}
  .pp-loadlink{background:none;border:0;color:var(--cobalt);font-weight:600;font-size:13px;cursor:pointer;padding:0;margin-top:8px;}

  .pp-lock{background:var(--ink);color:#fff;border-radius:12px;padding:14px 16px;margin-bottom:16px;}
  .pp-lock b{display:block;font-size:15px;margin-bottom:3px;}
  .pp-lock span{font-size:13px;color:#B9C0CB;}

  .pp-runrow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);}
  .pp-runrow:last-child{border-bottom:0;}
  .pp-bib{flex:none;width:34px;height:34px;border-radius:8px;border:1.5px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;}
  .pp-rname{flex:1;font-weight:600;font-size:15px;}
  .pp-time{width:118px;flex:none;font-size:16px;text-align:center;padding:10px 8px;border:1px solid var(--line);border-radius:10px;outline:none;background:#fff;color:var(--ink);}
  .pp-time:focus{border-color:var(--cobalt);box-shadow:0 0 0 3px rgba(39,67,224,.14);}
  .pp-time.bad{border-color:var(--warn);}
  .pp-time:disabled{background:#F1F3F6;color:var(--muted);}

  .pp-btn{width:100%;border:0;background:var(--cobalt);color:#fff;font-size:16px;font-weight:700;padding:15px;border-radius:12px;cursor:pointer;margin-top:16px;}
  .pp-btn:hover{background:var(--cobalt-deep);}
  .pp-btn:disabled{opacity:.5;cursor:not-allowed;}
  .pp-toast{margin-top:12px;background:var(--pop);color:var(--ink);font-weight:600;font-size:14px;padding:12px 14px;border-radius:11px;}
  .pp-toast.err{background:#FBE0E0;color:#8A1F1F;}

  .pp-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .pp-meta{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;}
  .pp-refresh{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);}

  .pp-view{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:14px;box-shadow:var(--shadow);}
  .pp-viewbtn{flex:1;border:0;background:transparent;padding:9px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;}
  .pp-viewbtn.on{background:var(--ink);color:#fff;}

  .pp-dcard{padding:14px;margin-bottom:12px;}
  .pp-dtop{display:flex;align-items:center;gap:11px;}
  .pp-dname{flex:1;font-weight:700;font-size:16px;}
  .pp-avg{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1;text-align:right;}
  .pp-avglab{font-size:11px;color:var(--muted);text-align:right;margin-top:3px;}
  .pp-actual{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:4px 9px;border-radius:7px;margin-top:10px;}

  .pp-glist{margin-top:12px;padding-top:6px;border-top:1px dashed var(--line);}
  .pp-grow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);}
  .pp-grow:last-child{border-bottom:0;}
  .pp-grow.win{background:var(--pop);margin:0 -14px;padding:9px 14px;border-bottom:0;border-radius:8px;}
  .pp-gname{flex:1;font-size:14px;font-weight:600;}
  .pp-gtime{font-size:15px;font-weight:700;}
  .pp-gwintag{font-size:10px;font-weight:800;background:var(--ink);color:#fff;border-radius:5px;padding:2px 6px;margin-left:8px;}

  .pp-ini{width:26px;height:26px;border-radius:50%;background:var(--cobalt);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none;}
  .pp-grow.win .pp-ini{background:var(--ink);}

  .pp-pchead{display:flex;align-items:center;gap:11px;padding:13px 14px;border-bottom:1px solid var(--line);}
  .pp-pcname{flex:1;font-weight:700;font-size:16px;}
  .pp-pcmeta{font-size:12px;color:var(--muted);}
  .pp-prow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);}
  .pp-prow:last-child{border-bottom:0;}
  .pp-pbib{flex:none;width:26px;font-size:11px;font-weight:700;color:var(--muted);}
  .pp-pname{flex:1;font-size:14px;font-weight:500;}
  .pp-ptime{font-size:15px;font-weight:700;}
  .pp-ptime.none{color:var(--muted);font-weight:400;}

  .pp-empty{text-align:center;padding:44px 20px;color:var(--muted);}
  .pp-empty b{color:var(--ink);display:block;font-size:16px;margin-bottom:4px;}

  .pp-lbrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line);}
  .pp-lbrow:last-child{border-bottom:0;}
  .pp-rank{flex:none;width:30px;height:30px;border-radius:8px;background:var(--paper);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
  .pp-lbrow.first{background:var(--pop);}
  .pp-lbrow.first .pp-rank{background:var(--ink);color:#fff;}
  .pp-lbname{flex:1;font-weight:700;font-size:15px;}
  .pp-lbcount{font-size:12px;color:var(--muted);font-weight:400;}
  .pp-lberr{text-align:right;}
  .pp-lberrbig{font-weight:800;font-size:16px;}
  .pp-lberrlab{font-size:11px;color:var(--muted);}
  .pp-lbrow.first .pp-lberrlab{color:var(--ink);}
  .pp-sechead{font-weight:700;font-size:15px;margin:22px 0 10px;}

  .pp-setup{padding:18px;margin-top:20px;}
  .pp-setup h2{font-size:17px;margin:0 0 8px;}
  .pp-setup p{font-size:14px;color:var(--muted);line-height:1.55;margin:0 0 10px;}
  .pp-setup code{background:var(--paper);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-family:ui-monospace,monospace;font-size:12px;}
  .pp-setup ol{margin:0;padding-left:20px;font-size:14px;line-height:1.7;}
  .pp-setup pre{background:var(--ink);color:#E6EBF2;border-radius:10px;padding:12px;overflow:auto;font-size:11px;line-height:1.5;margin-top:12px;}
</style>
</head>
<body>
<div id="root"></div>

<!--
  ============================================================================
  ONE-TIME DATABASE SETUP (Supabase)
  In your Supabase project -> SQL Editor -> New query -> paste ALL of this
  -> Run. It creates the tables and opens read/write access for the app.
  ----------------------------------------------------------------------------
  create table if not exists predictions (
    voter_id   text primary key,
    voter      text not null,
    times      jsonb not null default '{}',
    updated_at bigint
  );
  create table if not exists actuals (
    id   int  primary key,
    data jsonb not null default '{}'
  );
  insert into actuals (id, data) values (1, '{}') on conflict (id) do nothing;

  alter table predictions enable row level security;
  alter table actuals     enable row level security;

  create policy "read predictions"   on predictions for select using (true);
  create policy "insert predictions" on predictions for insert with check (true);
  create policy "update predictions" on predictions for update using (true) with check (true);

  create policy "read actuals"   on actuals for select using (true);
  create policy "insert actuals" on actuals for insert with check (true);
  create policy "update actuals" on actuals for update using (true) with check (true);
  ============================================================================
-->

<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

/* =========================================================================
   PASTE YOUR SUPABASE KEYS HERE
   Supabase -> Project Settings -> API
     - Project URL           -> SUPABASE_URL
     - Project API key "anon public" -> SUPABASE_ANON_KEY   (safe to expose)
   (Run the SQL in the comment above once before using the app.)
   ========================================================================= */
const SUPABASE_URL = "https://kjtofvlkewzoufclhgph.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_cvNfFPYksxgOAA-_SUuxiQ_bjqNG4LX";

const CONFIGURED = !SUPABASE_URL.includes("PASTE") && !SUPABASE_ANON_KEY.includes("PASTE");
let sb = null;
if (CONFIGURED) { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); }

// ---- Runners -------------------------------------------------------------
function slug(s){return String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"");}
const RUNNERS = [
  "Ighsaan","Max","Tristan T","Jade C","Jade B","Andre","Dean","Cleo","Gareth","Kristian"
].map((name,i)=>({id:slug(name),name,bib:i+1}));

// ---- Lock deadline: 6:00am, 13 September 2026 (device local time) ---------
const LOCK = new Date(2026,8,13,6,0,0).getTime();
const LOCK_LABEL = "Sat 13 Sep 2026, 6:00am";

// ---- Time helpers (digit entry -> h:mm:ss) -------------------------------
function onlyDigits(s){return String(s).replace(/\D/g,"").slice(0,5);}
function digitsToDisplay(d){d=onlyDigits(d);if(!d)return"";let o=d[0];if(d.length>=2)o+=":"+d.slice(1,3);if(d.length>=4)o+=":"+d.slice(3,5);return o;}
function digitsToSecs(d){d=onlyDigits(d);if(d.length<3)return null;const h=+d[0],mm=+d.slice(1,3),ss=d.length>=4?+d.slice(3,5).padEnd(2,"0"):0;if(mm>59||ss>59)return null;const t=h*3600+mm*60+ss;if(t<=0||t>6*3600)return null;return t;}
function digitsValid(d){return digitsToSecs(d)!=null;}
function secsToDigits(sec){const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;if(h>9)return"";return String(h)+String(m).padStart(2,"0")+String(s).padStart(2,"0");}
function fmt(sec){if(sec==null)return"\u2014";sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return h+":"+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
function fmtDelta(sec){sec=Math.round(Math.abs(sec));const m=Math.floor(sec/60),s=sec%60;return m+":"+String(s).padStart(2,"0");}
function fmtCountdown(ms){if(ms<=0)return"closed";const d=Math.floor(ms/86400000),h=Math.floor((ms%86400000)/3600000),m=Math.floor((ms%3600000)/60000);if(d>0)return "closes in "+d+"d "+h+"h";if(h>0)return "closes in "+h+"h "+m+"m";return "closes in "+Math.max(m,1)+"m";}
function initials(name){const p=name.trim().split(/\s+/);return (p[0]&&p[0][0]||"").toUpperCase()+(p[1]&&p[1][0]||"").toUpperCase();}

// ---- Data layer (Supabase) ----------------------------------------------
async function fetchAll(){
  const out={preds:[],actuals:{}};
  if(!sb) return out;
  try{
    const {data,error}=await sb.from("predictions").select("*");
    if(!error && data) out.preds = data.map(r=>({voter:r.voter, times:r.times||{}, updatedAt:r.updated_at}));
  }catch(e){}
  try{
    const {data,error}=await sb.from("actuals").select("data").eq("id",1).maybeSingle();
    if(!error && data && data.data) out.actuals = data.data;
  }catch(e){}
  return out;
}
async function savePrediction(vid,fullName,secs){
  const {error}=await sb.from("predictions").upsert({voter_id:vid, voter:fullName, times:secs, updated_at:Date.now()});
  if(error) throw error;
}
async function saveActuals(secs){
  const {error}=await sb.from("actuals").upsert({id:1, data:secs});
  if(error) throw error;
}

// ---- App -----------------------------------------------------------------
function App(){
  const [tab,setTab]=useState("predict");
  const [data,setData]=useState({preds:[],actuals:{}});
  const [loading,setLoading]=useState(true);
  const [now,setNow]=useState(Date.now());

  const refresh=useCallback(async()=>{
    setNow(Date.now());
    const d=await fetchAll();
    setData(d);setLoading(false);
  },[]);

  useEffect(()=>{ if(!CONFIGURED){setLoading(false);return;} refresh(); },[refresh]);
  useEffect(()=>{ if(!CONFIGURED)return; const iv=setInterval(refresh,10000); return ()=>clearInterval(iv); },[refresh]);

  const locked = now>=LOCK;
  if(!CONFIGURED) return <SetupScreen/>;

  return (
    <div className="pp-root">
      <div className="pp-checker"/>
      <div className="pp-wrap">
        <header className="pp-head">
          <h1 className="pp-title">Podium <span>Predictions</span></h1>
          <p className="pp-sub">Guess everyone's half marathon finish time. Closest picks win once the real results are in.</p>
          <p className="pp-privacy"><span className="pp-dot"/> Shared board — everyone sees all predictions.</p>
          <p className={"pp-deadline"+(locked?" closed":"")}>
            {locked ? <span>Predictions closed — <b>{LOCK_LABEL}</b></span>
                    : <span>Locks <b>{LOCK_LABEL}</b> · {fmtCountdown(LOCK-now)}</span>}
          </p>
        </header>

        <nav className="pp-tabs">
          {[["predict","Predict"],["dashboard","Dashboard"],["results","Results"]].map(([k,l])=>(
            <button key={k} className={"pp-tab"+(tab===k?" on":"")} onClick={()=>setTab(k)}>{l}</button>
          ))}
        </nav>

        {tab==="predict"   && <Predict data={data} locked={locked} onSaved={refresh}/>}
        {tab==="dashboard" && <Dashboard data={data} loading={loading} onRefresh={refresh}/>}
        {tab==="results"   && <Results data={data} onSaved={refresh}/>}
      </div>
    </div>
  );
}

// ---- Predict -------------------------------------------------------------
function Predict({data,locked,onSaved}){
  const [name,setName]=useState("");
  const [surname,setSurname]=useState("");
  const [digits,setDigits]=useState({});
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState("");
  const [err,setErr]=useState(false);

  const fullName = (name.trim()+" "+surname.trim()).replace(/\s+/g," ").trim();
  const vid = slug(fullName);
  const existing = useMemo(()=>data.preds.find(p=>slug(p.voter)===vid),[data.preds,vid]);

  const setD=(id,v)=>setDigits(t=>({...t,[id]:onlyDigits(v)}));

  const loadPrevious=()=>{
    if(!existing)return;
    const t={};
    RUNNERS.forEach(r=>{if(existing.times&&existing.times[r.id]!=null)t[r.id]=secsToDigits(existing.times[r.id]);});
    setDigits(t);setErr(false);setToast("Loaded your saved picks — edit and save again.");
  };

  const filled = RUNNERS.filter(r=>digitsValid(digits[r.id])).length;
  const canSave = name.trim().length>0 && surname.trim().length>0 && filled>0 && !saving && !locked;

  const save=async()=>{
    if(!canSave)return;setSaving(true);setErr(false);
    const secs={};RUNNERS.forEach(r=>{const s=digitsToSecs(digits[r.id]);if(s!=null)secs[r.id]=s;});
    try{
      await savePrediction(vid,fullName,secs);
      setToast("Saved "+filled+" pick"+(filled===1?"":"s")+", "+name.trim()+". Check the dashboard.");
      await onSaved();
    }catch(e){setErr(true);setToast("Couldn't save — check your connection and try again.");}
    setSaving(false);
  };

  return (
    <div>
      {locked &&
        <div className="pp-lock">
          <b>Predictions are closed</b>
          <span>The deadline ({LOCK_LABEL}) has passed. Head to the Dashboard to see everyone's picks.</span>
        </div>}

      <div className="pp-namebar">
        <p className="pp-label">Your name — first &amp; surname (both required)</p>
        <div style={{display:"flex",gap:8}}>
          <input className="pp-input" style={{flex:1,minWidth:0}} placeholder="First name"
                 value={name} disabled={locked}
                 onChange={e=>{setName(e.target.value);setToast("");}}/>
          <input className="pp-input" style={{flex:1,minWidth:0}} placeholder="Surname"
                 value={surname} disabled={locked}
                 onChange={e=>{setSurname(e.target.value);setToast("");}}/>
        </div>
        {existing && !locked &&
          <button className="pp-loadlink" onClick={loadPrevious}>{fullName} already has picks — load &amp; edit them</button>}
      </div>

      <p className="pp-hint" style={{margin:"0 2px 8px"}}>
        Just tap the numbers — no colon needed. Type 1 5 2 for 1:52:00, or 1 5 2 3 0 for 1:52:30.
      </p>

      <div className="pp-card">
        {RUNNERS.map(r=>{
          const d=digits[r.id]||"";const bad=d.length>0&&!digitsValid(d);
          return (
            <div className="pp-runrow" key={r.id}>
              <div className="pp-bib pp-mono">{String(r.bib).padStart(2,"0")}</div>
              <div className="pp-rname">{r.name}</div>
              <input className={"pp-time pp-mono"+(bad?" bad":"")} inputMode="numeric" pattern="[0-9]*"
                     placeholder="1:52:00" value={digitsToDisplay(d)} disabled={locked}
                     onChange={e=>setD(r.id,e.target.value)}/>
            </div>
          );
        })}
      </div>

      <button className="pp-btn" disabled={!canSave} onClick={save}>
        {locked?"Predictions closed":saving?"Saving…":("Save my "+(filled||"")+" pick"+(filled===1?"":"s")).replace("  "," ").trim()}
      </button>
      {toast && <div className={"pp-toast"+(err?" err":"")}>{toast}</div>}
    </div>
  );
}

// ---- Dashboard -----------------------------------------------------------
function Dashboard({data,loading,onRefresh}){
  const [view,setView]=useState("runner");
  const voterCount=data.preds.length;

  const byRunner=useMemo(()=>{
    return RUNNERS.map(r=>{
      const guesses=[];
      data.preds.forEach(p=>{const s=p.times&&p.times[r.id];if(s!=null)guesses.push({voter:p.voter,sec:s});});
      const avg=guesses.length?guesses.reduce((a,g)=>a+g.sec,0)/guesses.length:null;
      const actual=data.actuals[r.id]!=null?data.actuals[r.id]:null;
      let winner=null;
      if(actual!=null&&guesses.length){winner=guesses.reduce((b,g)=>Math.abs(g.sec-actual)<Math.abs(b.sec-actual)?g:b);}
      guesses.sort((a,b)=>a.sec-b.sec);
      return {...r,guesses,avg,actual,winner};
    }).sort((a,b)=>{
      if(a.avg==null&&b.avg==null)return a.bib-b.bib;
      if(a.avg==null)return 1;if(b.avg==null)return -1;return a.avg-b.avg;
    });
  },[data]);

  const voters=useMemo(()=>[...data.preds].sort((a,b)=>a.voter.localeCompare(b.voter)),[data.preds]);
  const anyGuesses=byRunner.some(r=>r.guesses.length>0);

  return (
    <div>
      <div className="pp-bar">
        <span className="pp-meta">
          <span className="pp-dot live"/>
          {loading?"Loading…":(voterCount+" "+(voterCount===1?"person has":"people have")+" predicted")}
        </span>
        <button className="pp-refresh" onClick={onRefresh}>Refresh</button>
      </div>

      {!anyGuesses ?
        <div className="pp-card pp-empty"><b>No predictions yet</b>Head to the Predict tab and be the first to lock in your guesses.</div>
      :
        <div>
          <div className="pp-view">
            <button className={"pp-viewbtn"+(view==="runner"?" on":"")} onClick={()=>setView("runner")}>By runner</button>
            <button className={"pp-viewbtn"+(view==="predictor"?" on":"")} onClick={()=>setView("predictor")}>By predictor</button>
          </div>

          {view==="runner" && byRunner.map(r=>(
            <div className="pp-card pp-dcard" key={r.id}>
              <div className="pp-dtop">
                <div className="pp-bib pp-mono">{String(r.bib).padStart(2,"0")}</div>
                <div className="pp-dname">{r.name}</div>
                <div><div className="pp-avg pp-mono">{fmt(r.avg)}</div><div className="pp-avglab">avg of {r.guesses.length}</div></div>
              </div>
              {r.actual!=null && <div className="pp-actual pp-mono">Finished {fmt(r.actual)}</div>}
              {r.guesses.length>0 &&
                <div className="pp-glist">
                  {r.guesses.map((g,i)=>{
                    const win=r.winner&&g.voter===r.winner.voter&&g.sec===r.winner.sec;
                    return (
                      <div className={"pp-grow"+(win?" win":"")} key={i}>
                        <span className="pp-ini">{initials(g.voter)}</span>
                        <span className="pp-gname">{g.voter}{win&&<span className="pp-gwintag">CLOSEST</span>}</span>
                        <span className="pp-gtime pp-mono">{fmt(g.sec)}</span>
                      </div>
                    );
                  })}
                </div>}
            </div>
          ))}

          {view==="predictor" && voters.map(p=>{
            const count=RUNNERS.filter(r=>p.times&&p.times[r.id]!=null).length;
            return (
              <div className="pp-card" key={p.voter} style={{marginBottom:12}}>
                <div className="pp-pchead">
                  <span className="pp-ini">{initials(p.voter)}</span>
                  <span className="pp-pcname">{p.voter}</span>
                  <span className="pp-pcmeta">{count} pick{count===1?"":"s"}</span>
                </div>
                {RUNNERS.map(r=>{
                  const s=p.times&&p.times[r.id];
                  return (
                    <div className="pp-prow" key={r.id}>
                      <span className="pp-pbib pp-mono">{String(r.bib).padStart(2,"0")}</span>
                      <span className="pp-pname">{r.name}</span>
                      <span className={"pp-ptime pp-mono"+(s==null?" none":"")}>{s==null?"\u2014":fmt(s)}</span>
                    </div>
                  );
                })}
              </div>
            );
          })}
        </div>
      }
    </div>
  );
}

// ---- Results -------------------------------------------------------------
function Results({data,onSaved}){
  const [digits,setDigits]=useState({});
  const [saving,setSaving]=useState(false);
  const [toast,setToast]=useState("");
  const [err,setErr]=useState(false);

  useEffect(()=>{
    setDigits(prev=>{
      const next={...prev};
      RUNNERS.forEach(r=>{if(!next[r.id]&&data.actuals[r.id]!=null)next[r.id]=secsToDigits(data.actuals[r.id]);});
      return next;
    });
  },[data.actuals]);

  const save=async()=>{
    setSaving(true);setErr(false);
    const secs={};RUNNERS.forEach(r=>{const s=digitsToSecs(digits[r.id]);if(s!=null)secs[r.id]=s;});
    try{await saveActuals(secs);setToast("Results saved. Leaderboard updated below.");await onSaved();}
    catch(e){setErr(true);setToast("Couldn't save results — try again.");}
    setSaving(false);
  };

  const board=useMemo(()=>{
    const withActual=RUNNERS.filter(r=>data.actuals[r.id]!=null);
    if(!withActual.length)return[];
    return data.preds.map(p=>{
      let e=0,count=0;
      withActual.forEach(r=>{const pred=p.times&&p.times[r.id];if(pred!=null){e+=Math.abs(pred-data.actuals[r.id]);count++;}});
      return {voter:p.voter,err:e,count};
    }).filter(v=>v.count>0).sort((a,b)=>a.err-b.err);
  },[data]);

  return (
    <div>
      <p className="pp-hint" style={{margin:"0 2px 12px"}}>
        After the race, enter each runner's real finish time (same digit entry — no colon needed). The leaderboard ranks everyone by how close their guesses were.
      </p>
      <div className="pp-card">
        {RUNNERS.map(r=>{
          const d=digits[r.id]||"";const bad=d.length>0&&!digitsValid(d);
          return (
            <div className="pp-runrow" key={r.id}>
              <div className="pp-bib pp-mono">{String(r.bib).padStart(2,"0")}</div>
              <div className="pp-rname">{r.name}</div>
              <input className={"pp-time pp-mono"+(bad?" bad":"")} inputMode="numeric" pattern="[0-9]*"
                     placeholder="—:—:—" value={digitsToDisplay(d)}
                     onChange={e=>setDigits(a=>({...a,[r.id]:onlyDigits(e.target.value)}))}/>
            </div>
          );
        })}
      </div>
      <button className="pp-btn" onClick={save} disabled={saving}>{saving?"Saving…":"Save results"}</button>
      {toast && <div className={"pp-toast"+(err?" err":"")}>{toast}</div>}

      <div className="pp-sechead">Leaderboard</div>
      {board.length===0 ?
        <div className="pp-card pp-empty"><b>No results yet</b>Add at least one real finish time above to rank the predictions.</div>
      :
        <div className="pp-card">
          {board.map((v,i)=>(
            <div className={"pp-lbrow"+(i===0?" first":"")} key={v.voter}>
              <div className="pp-rank">{i+1}</div>
              <div className="pp-lbname">{v.voter} <span className="pp-lbcount">· {v.count} runner{v.count===1?"":"s"}</span></div>
              <div className="pp-lberr"><div className="pp-lberrbig pp-mono">{fmtDelta(v.err)}</div><div className="pp-lberrlab">total off by</div></div>
            </div>
          ))}
        </div>
      }
    </div>
  );
}

// ---- Setup screen (shown until keys are pasted) --------------------------
function SetupScreen(){
  return (
    <div className="pp-root">
      <div className="pp-checker"/>
      <div className="pp-wrap">
        <header className="pp-head"><h1 className="pp-title">Podium <span>Predictions</span></h1></header>
        <div className="pp-card pp-setup">
          <h2>Almost there — connect Supabase</h2>
          <p>This page needs your Supabase project so everyone's picks are shared. Two quick steps in a text editor:</p>
          <ol>
            <li>In Supabase → <b>SQL Editor</b>, paste &amp; run the SQL that's in the comment at the top of this file (creates the tables).</li>
            <li>Supabase → <b>Project Settings → API</b>: copy your <b>Project URL</b> and <b>anon public</b> key.</li>
            <li>Paste them into <code>SUPABASE_URL</code> and <code>SUPABASE_ANON_KEY</code> near the top of this file.</li>
            <li>Re-upload the file to your host and refresh.</li>
          </ol>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
